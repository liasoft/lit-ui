# Weekly, grouped, and at most one open PR per ecosystem at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      # A production dependency bump is a released fix; dev tooling is a chore.
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
