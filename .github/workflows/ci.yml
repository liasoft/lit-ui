name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npm run build:demo

      - name: Verify documented Sass theming example
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/node_modules/@liasoft"
          ln -s "$GITHUB_WORKSPACE" "$consumer/node_modules/@liasoft/lit-ui"
          cat > "$consumer/theme.scss" <<'EOF'
          @use 'pkg:@liasoft/lit-ui/scss/app' with (
            $lia-800: #0f766e,
            $primary: #0f766e,
            $lia-sidebar-width: 280px
          );
          EOF
          npx sass --pkg-importer=node --load-path=node_modules --quiet-deps \
            --silence-deprecation=import,global-builtin,color-functions \
            "$consumer/theme.scss" "$consumer/theme.css"
          grep -F -- '--bs-primary: #0f766e;' "$consumer/theme.css"
          grep -F -- 'width: 280px;' "$consumer/theme.css"
          if grep -F -- 'width: 256px;' "$consumer/theme.css"; then
            echo "default sidebar width leaked into configured theme" >&2
            exit 1
          fi
